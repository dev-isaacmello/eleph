<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#1668c5" />
    <meta name="theme-color" content="#fffefb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />

    <title>eleph — a language whose programs cannot lie</title>
    <meta
      name="description"
      content="Official documentation for eleph: speech acts, a history that is the only state, and correctness conditions derived from the program text rather than written beside it."
    />
    <link rel="canonical" href="__ORIGIN__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eleph" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:title" content="eleph — a language whose programs cannot lie" />
    <meta
      property="og:description"
      content="Speech acts, a history that is the only state, and correctness conditions derived from the program text rather than written beside it."
    />
    <meta property="og:image" content="__ORIGIN__/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap"
    />

    <script>
      // Resolve the theme before first paint so the page never flashes.
      (function () {
        try {
          var saved = localStorage.getItem('eleph-theme')
          var system = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          document.documentElement.dataset.theme = saved || system
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
