name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A virtual environment, not --system: the runner's system Python is
      # externally managed, and --system would also quietly ignore the matrix
      # and test whatever version the image happens to ship.
      - name: install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev,mcp,langchain]"

      - name: the python under test is the one the matrix asked for
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python }}'), sys.version; print(sys.version)"

      - name: tests
        run: uv run pytest -q

      - name: every example verifies as expected
        run: |
          set -e
          for f in examples/airline.eleph examples/booking.eleph examples/companhia.eleph examples/langchain-agent/policy.eleph; do
            uv run eleph check "$f" --no-color | tail -2 | grep -q PROVADO
          done
          for f in examples/airline_buggy.eleph examples/booking_buggy.eleph examples/fundo.eleph; do
            uv run eleph check "$f" --no-color | tail -2 | grep -q REPROVADO
          done

      - name: the three integration shapes run
        run: uv run python examples/agente.py > /dev/null

      # A language site that prints a program which does not parse is making a
      # claim it never ran. This caught three: a fact wrapped across lines, in
      # eighteen files, and an event used in a fact without being declared, on
      # the page that teaches program structure.
      - name: every program printed on the docs site is a program
        if: matrix.python == '3.13'
        run: uv run python site/scripts/check-eleph-blocks.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: build sdist and wheel
        run: uv build

      - name: the wheel installs and the cli works
        run: |
          uv venv
          uv pip install dist/*.whl
          uv run eleph check examples/airline_buggy.eleph --no-color | tail -2 | grep -q REPROVADO
          uv run eleph check examples/companhia.eleph --no-color | tail -2 | grep -q PROVADO

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
