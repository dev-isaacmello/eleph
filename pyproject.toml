[project]
name = "eleph"
version = "0.2.0"
description = "A language whose programs cannot lie: speech acts, a history that is the only state, and correctness conditions derived from the program text rather than written beside it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Mello" }]
keywords = [
    "programming-language", "speech-acts", "formal-verification",
    "event-sourcing", "temporal-logic", "smt", "z3",
    "ai-agents", "agent-reliability", "commitments", "runtime-verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["z3-solver>=4.12"]

[project.urls]
Homepage = "https://github.com/isaacmello/eleph"
Source = "https://github.com/isaacmello/eleph"
Issues = "https://github.com/isaacmello/eleph/issues"
Changelog = "https://github.com/isaacmello/eleph/blob/main/CHANGELOG.md"

[project.scripts]
eleph = "eleph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic>=0.40"]   # only for the natural language front end

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eleph"]

[tool.hatch.build.targets.sdist]
include = [
    "/eleph",
    "/examples",
    "/tests",
    "/bench",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]
exclude = ["bench/taubench/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
